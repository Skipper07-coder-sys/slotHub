name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this version, e.g. v1.7.1. The tag is created
          on the chosen branch by the workflow. Leave empty to only build.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      release: ${{ steps.name.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      # A tag push or a dispatch with a version is a release; anything else is a
      # build named after its branch.
      - name: Name the tree
        id: name
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -eu
          case "$GITHUB_REF" in
          refs/tags/*) RELEASE="$GITHUB_REF_NAME" ;;
          *)
            if [ -n "$RELEASE" ] && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE" >/dev/null; then
              echo "$RELEASE is already tagged" >&2
              exit 1
            fi
            ;;
          esac
          if [ -n "$RELEASE" ]; then
            case "$RELEASE" in
            v[0-9]*) ;;
            *) echo "release must look like v1.7.1, got '$RELEASE'" >&2; exit 1 ;;
            esac
            echo "OUT=slot-$RELEASE" >> "$GITHUB_ENV"
          else
            echo "OUT=slot-$(echo "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build the tree
        run: task dist:device OUT="$OUT"

      - name: Add File Browser for Wi-Fi Drive
        env:
          FB_VERSION: v2.32.0
          FB_SHA256: 1d45a0ea437ab23ffa9fac0f52064ca5e91e4e43828a4e29f0d5bcbf60fdbf03
        run: |
          set -eu
          tmp="$(mktemp -d)"
          base="https://github.com/filebrowser/filebrowser/releases/download/$FB_VERSION"
          curl -fsSL -o "$tmp/linux-arm64-filebrowser.tar.gz" "$base/linux-arm64-filebrowser.tar.gz"
          echo "$FB_SHA256  $tmp/linux-arm64-filebrowser.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/linux-arm64-filebrowser.tar.gz" -C "$tmp" filebrowser
          mkdir -p "$OUT/System/bin"
          install -m 755 "$tmp/filebrowser" "$OUT/System/bin/filebrowser"
          curl -fsSL -o "$OUT/System/licenses/filebrowser-LICENSE" \
            "https://raw.githubusercontent.com/filebrowser/filebrowser/$FB_VERSION/LICENSE"
          echo "filebrowser $FB_VERSION (Apache-2.0), https://github.com/filebrowser/filebrowser" \
            > "$OUT/System/licenses/filebrowser.meta"

      - name: Stamp the release the tree came from
        # A test build is named by its commit, short enough for the Update page.
        run: echo "${RELEASE:-dev-$(echo "$GITHUB_SHA" | cut -c1-7)}" > "$OUT/System/release"

      - name: List every shipped file with its checksum
        # The handheld's self-test (report.sh) checks System against this
        # after each update. Licences are left out: they do not run.
        run: |
          set -eu
          cd "$OUT/System"
          find . -type f ! -path './licenses/*' ! -name MANIFEST.sha256 | sed 's|^\./||' | sort \
            | while read -r f; do sha256sum "$f"; done > MANIFEST.sha256
          test -s MANIFEST.sha256
          sha256sum -c --quiet MANIFEST.sha256

      - name: Check what is about to ship
        run: |
          set -eu
          out="$OUT"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          file "$out/System/bin/filebrowser" | grep -q aarch64
          test -x "$out/System/bin/filebrowser"
          test -f "$out/System/licenses/filebrowser-LICENSE"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="$OUT"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          sha256sum "$zip" > SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: needs.build.outputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          Unzip and copy the contents of \`slot-${RELEASE}/\` onto SD2, or pick Update in slot's quick menu over Wi-Fi.

          Emulation by mGBA (MPL-2.0) and gpSP (GPL-2.0). Their licences, patches and gpSP's source are in \`System/licenses/\`.
          NOTES
          # --target makes the tag when a dispatch asked for a release; on a tag
          # push the tag already points at this commit.
          gh release create "$RELEASE" "$ZIP" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE" --notes-file notes.md